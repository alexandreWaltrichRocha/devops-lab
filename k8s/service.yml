apiVersion: v1
kind: Service
metadata:
  name: devops-lab-service
  labels:
    app: devops-lab          # usado pelo ServiceMonitor (k8s/monitoring/)
spec:
  type: NodePort
  selector:
    app: devops-lab
  ports:
    - name: http             # nome obrigatório para o ServiceMonitor apontar a porta
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
