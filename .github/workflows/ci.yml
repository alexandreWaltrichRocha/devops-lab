name: CI/CD Pipeline - DevOps Lab

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]          # release: git tag v1.2.3 && git push --tags
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: alexandrew2033/devops-lab

jobs:
  # 1) Testes e validações estáticas: rodam em PR e em push
  test:
    name: Testes e validações
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes unitários (pytest)
        run: pytest -v

      - name: Validar config do Prometheus e regras de alerta
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.51.0 check config /etc/prometheus/prometheus.yml

      - name: Validar manifests Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            k8s/

      - name: Validar docker-compose
        run: GRAFANA_ADMIN_PASSWORD=ci docker compose config -q

  # 2) Teste de fumaça: sobe a stack inteira e faz requisições reais
  smoke-test:
    name: Smoke test da stack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Subir stack (aguarda healthchecks)
        run: GRAFANA_ADMIN_PASSWORD=ci docker compose up -d --build --wait --wait-timeout 120

      - name: Requisições de verificação
        run: |
          curl -fsS http://localhost/nginx-health
          curl -fsS http://localhost/ | grep '"total_visitors"'
          # /metrics não pode ficar público pelo Nginx
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/metrics)" = "404"
          # Prometheus enxerga a API
          for i in $(seq 1 12); do
            curl -fsS 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22fastapi-app%22%7D' | grep -q '"1"\]' && exit 0
            sleep 5
          done
          echo "Prometheus não conseguiu coletar métricas da API" >&2; exit 1

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  # 3) Build da imagem; push SÓ fora de pull_request (merge em main ou tag)
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: [test, smoke-test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (e push, se não for PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy: intencionalmente fora do pipeline. O cluster roda local (WSL2) e um
  # runner do GitHub não alcança ele. Após o push, atualize com:
  #   kubectl rollout restart deployment/devops-lab-deployment
