# Rate limit por IP (generoso, não atrapalha testes de carga leves).
# Este arquivo é incluído no contexto `http {}` do Nginx, então a zona pode
# ser declarada aqui.
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker: resolve "web" a cada 10s, então o Nginx não cai
    # se o container da API for recriado e mudar de IP.
    resolver 127.0.0.11 valid=10s;

    # Health do próprio Nginx (não depende da API).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /metrics é para o Prometheus (que acessa web:8000 direto pela rede
    # interna). Não deve ficar público pela porta 80.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=api burst=200 nodelay;

        set $backend "http://web:8000";
        proxy_pass $backend;

        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
